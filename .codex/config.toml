[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GH_TOKEN"

[mcp_servers.mate]
command = "docker"
args = ["compose", "-f", ".docker/docker-compose.dev.yaml", "--project-name", "collectaprime-dev", "exec", "-T", "app", "php", "vendor/bin/mate", "serve"]

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
startup_timeout_ms = 40_000

[mcp_servers.serena]
command = "serena"
args = ["start-mcp-server", "--context=codex", "--project-from-cwd"]

